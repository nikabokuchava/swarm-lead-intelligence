services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: swarm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-swarm_leads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:15433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swarm} -d ${POSTGRES_DB:-swarm_leads}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Migrations (one-shot) ────────────────────────────────────────────────
  # Runs to completion before either long-running service starts, so neither
  # races an unmigrated schema and both cannot run `migrate deploy` at once.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: swarm_migrate
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm_secret}@postgres:5432/${POSTGRES_DB:-swarm_leads}
      NODE_ENV: production

  # ─── Job Poller (Maps collection) ─────────────────────────────────────────
  # Separate service, not a background child of the worker: as its own container
  # its death exits the container and `restart: always` actually fires. Under the
  # previous single-container supervisor a dead poller was invisible — the health
  # endpoint lives in the worker only, so the container stayed up and healthy
  # while Maps collection was down.
  job-poller:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: swarm_poller
    restart: always
    shm_size: '2gb'
    command: ['node', 'dist/index.js', '--serve']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm_secret}@postgres:5432/${POSTGRES_DB:-swarm_leads}
      NODE_ENV: production
      HEADLESS: 'true'
      LOG_FILE: /app/logs/poller.log
      MAX_RESULTS: '50'
      SCROLL_DELAY_MS: '1200'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    volumes:
      - worker_logs:/app/logs
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8081/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Scraper Worker (email crawl + verification) ──────────────────────────
  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: swarm_worker
    restart: always
    shm_size: '2gb'
    command: ['node', 'dist/worker.js']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm_secret}@postgres:5432/${POSTGRES_DB:-swarm_leads}
      NODE_ENV: production
      HEADLESS: 'true'
      LOG_FILE: /app/logs/worker.log
      MAX_RESULTS: '50'
      SCROLL_DELAY_MS: '1200'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    volumes:
      - worker_logs:/app/logs
    healthcheck:
      # Worker exposes a health endpoint on WORKER_HEALTH_PORT (default 8080).
      # node one-liner because the slim image ships neither curl nor wget.
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8080/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  worker_logs:
    driver: local
