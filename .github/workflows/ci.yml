name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Unit tests mock Prisma; no browser is launched, so skip the ~150 MB download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/postgres'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed — typecheck needs it.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dashboard:
    name: Dashboard — lint, test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/postgres'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      # No `prisma generate` here: these tests mock `@/lib/db` outright,
      # so no generated client is loaded.
      - run: npm run lint
      - run: npm test
